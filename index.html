<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shakley</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #fbfaf8; color: #1e1c1a; }
    nav a { display: inline-block; padding: 8px 16px; margin-right: 4px; text-decoration: none; color: #1e1c1a; border: 1px solid #e3e3e3; border-radius: 20px; font-size: 15px; }
    .brand { font-size: 20px; font-weight: bold; margin-right: 40px; }
    h1 { font-size: 44px; margin-top: 48px; }
    h1 span { display: block; }
    .sub { font-size: 18px; color: #555; max-width: 420px; }
    .pills { margin-top: 24px; }
    .pills button { padding: 10px 18px; margin-right: 8px; border: 1px solid #e3e3e3; border-radius: 22px; background: #fff; font-size: 15px; cursor: pointer; }
    .prompt { margin-top: 24px; max-width: 480px; padding: 20px; background: #fff; border: 1px solid #e3e3e3; border-radius: 12px; }
    .prompt input { width: 100%; font-size: 17px; padding: 8px 0; border: none; outline: none; background: transparent; }
    .prompt button { margin-top: 12px; padding: 10px 18px; border: 1px solid #e3e3e3; border-radius: 22px; background: #fff; cursor: pointer; }
    section { margin-top: 48px; }
    section a { padding: 10px 20px; border: 1px solid #e3e3e3; border-radius: 22px; text-decoration: none; color: #1e1c1a; font-size: 15px; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">Shakley</span>
    <a href="#">Browse</a>
    <a href="#">Pantry</a>
    <a href="#">Saved</a>
  </nav>

  <h1>
    <span>What are we</span>
    <span>blending today?</span>
  </h1>
  <p class="sub">Hundreds of protein shakes and smoothies, built from what's in your kitchen.</p>

  <div class="pills">
    <button>Quick · 2m</button>
    <button>Loaded · 5m</button>
    <button>Athlete · 8m</button>
  </div>

  <div class="prompt">
    <input type="text" placeholder="Describe your shake…" />
    <div>
      <button>Pantry</button>
      <button>Find shakes</button>
    </div>
  </div>

  <section>
    <h2>Your saved shakes.</h2>
    <p>Pick up where you left off.</p>
    <a href="#">See all</a>
  </section>
</body>
</html>
